name: 'Changelog Summary'
description: 'Summarize git commits with AI and post to Slack'
author: 'Evgeny Oleynik'

branding:
  icon: 'git-commit'
  color: 'blue'

inputs:
  slack-webhook:
    description: 'Slack webhook URL'
    required: true
  llm-provider:
    description: 'LLM provider: gemini, openai, or anthropic'
    required: false
    default: 'gemini'
  llm-api-key:
    description: 'API key for the LLM provider'
    required: true
  since:
    description: 'Time range for commits (e.g., "24 hours ago", "7 days ago")'
    required: false
    default: '24 hours ago'
  header:
    description: 'Header text for the message'
    required: false
    default: 'Daily Update'
  voice:
    description: 'Summary voice: founder, developer, or marketing'
    required: false
    default: 'founder'
  project-name:
    description: 'Project name for the header'
    required: false
    default: ''
  identity-map:
    description: |
      Newline-separated "match = Real Name" rules that fold bot and alias authors
      into the human who owns them. Match on the author email or the author name.
      Anything unmatched keeps its own name. Example:
        evoleinik@gmail.com = Evgeny
        github-actions[bot] = Evgeny
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Generate and send summary
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook }}
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        SINCE: ${{ inputs.since }}
        HEADER: ${{ inputs.header }}
        VOICE: ${{ inputs.voice }}
        PROJECT_NAME: ${{ inputs.project-name }}
        IDENTITY_MAP: ${{ inputs.identity-map }}
      run: |
        set -euo pipefail

        # Default project name to repo name
        if [ -z "$PROJECT_NAME" ]; then
          PROJECT_NAME="${GITHUB_REPOSITORY##*/}"
        fi

        DATE_DISPLAY=$(date +"%b %d")

        COMMIT_COUNT=$(git log --since="$SINCE" --oneline --no-merges | wc -l | tr -d ' ')

        # Fold bot and alias authors into the human who owns them, so one person
        # committing as Eugene, AirShelf Loop and github-actions[bot] counts once.
        declare -A IDENTITY
        while IFS= read -r rule; do
          case "$rule" in *=*) ;; *) continue ;; esac
          key="${rule%%=*}"; val="${rule#*=}"
          key="$(printf '%s' "$key" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          val="$(printf '%s' "$val" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "$key" ] && [ -n "$val" ]; then IDENTITY["$key"]="$val"; fi
        done <<< "${IDENTITY_MAP:-}"

        # Records are \x1e-separated, fields \x1f-separated, so a commit body
        # containing newlines cannot break the parse.
        COMMITS=""
        AUTHORS=""
        while IFS=$'\x1f' read -r -d $'\x1e' C_NAME C_EMAIL C_BODY; do
          C_NAME="${C_NAME#$'\n'}"
          WHO="${IDENTITY[$C_EMAIL]:-}"
          if [ -z "$WHO" ]; then WHO="${IDENTITY[$C_NAME]:-$C_NAME}"; fi
          COMMITS+="[$WHO] $C_BODY"$'\n'
          AUTHORS+="$WHO"$'\n'
        done < <(git log --since="$SINCE" --no-merges \
          --pretty=format:"%an%x1f%ae%x1f%s%n%b%x1e" 2>/dev/null || true)

        # Exit if no commits
        if [ "$COMMIT_COUNT" -eq 0 ] || [ -z "$COMMITS" ]; then
          echo "No commits found since $SINCE, skipping notification"
          exit 0
        fi

        CONTRIBUTOR_COUNT=$(printf '%s' "$AUTHORS" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')

        # Build prompt based on voice
        case "$VOICE" in
          founder)
            PROMPT="Summarize these commits for the founder of $PROJECT_NAME, in his own voice.
        Each commit is prefixed with its author in square brackets.

        SHAPE
        Group by person. Under each person, group by category. Under each category, list the work.
        Three levels, like this, and nothing else:

        *Evgeny*
        • *Distribution*
            ◦ *New* Public acp.json well-known entry for agent discovery
            ◦ *Fix* Repointed ACP discovery routes onto agents.airshelf.ai
        • *Plumbing*
            ◦ *New* pytest sharded across three runners, CI 8 min down to 2 min

        *Aditi*
        • *Product*
            ◦ *New* Priority action engine on the merchant overview

        TAG EVERY LEAF
        Every leaf opens with one tag, then a space, then the fragment. Read the tag off the commit's own type prefix.
        feat is *New*. fix and perf are *Fix*. docs, chore, refactor and test are *Docs*.
        A commit with no type prefix takes the tag its subject earns. A new thing is *New*, a repair is *Fix*, anything else is *Docs*.
        The tag does not count toward the word limit. The fragment after it still starts with a past-tense verb or the name of the thing.

        WRITE FRAGMENTS, NOT SENTENCES
        Each leaf is a short fragment. Around 8 words, never more than 14. No full stop at the end.
        Start it with a plain past-tense verb or the name of the thing. No connectors, no because, no which, no while.
        One fact per leaf. If a leaf carries two facts, it is two leaves.
        No em-dashes, no semicolons, no mid-sentence colons.

        VOICE
        Direct and skeptical. Plain English, short everyday words. No metaphors, no jargon, no buzzwords.
        Banned words: leverage, surface (as a verb), orchestrate, robust, holistic, seamless, powerful, exciting, significantly, comprehensive, finally.

        NEVER INFLATE
        Say what changed and what it now makes possible. Never say how hard it was, how much work it took, or how many files moved.
        Drop adjectives. No major, big, huge, critical, significant.
        If someone had a quiet day, give them one leaf. Never pad. Never invent work that is not in the commits.

        CATEGORIES
        Use only these tags. Never invent one.
        Catalog: vendor catalogs, extraction, golden records, product identity and dedup, plus the receipts, provenance, accuracy gates and fabrication guards that make those records trustworthy. This is one area, not two.
        Distribution: MCP, ACP and shop API, agents.airshelf.ai, GMC feeds, edge serving.
        Visibility: benchmarks, citations, the content loop, apex articles, share of voice.
        AX: the AX score itself, ax.airshelf.ai, readiness audits, paid audits.
        Product: merchant dashboard, widget and BIME, onboarding, billing.
        Plumbing: CI, verifiers, cron, infrastructure, delegation.
        Tie-breakers. Anything measuring how AI answers, including a new benchmark provider, is Visibility. The chat widget is Product.

        LIMITS
        Order people by how much they shipped, most first. Use the name in the brackets exactly, and never mention a bot.
        At most four categories per person. One Plumbing bullet per person, never more.
        HARD CAP: three leaves per category. Never four. If a category has more, keep the three that matter and drop the rest.
        Under that cap *New* beats *Fix*, and *Fix* beats *Docs*. A *Docs* leaf never displaces a *New* or a *Fix* one.
        Drop generated bookkeeping outright. Daily snapshots, decision logs and manifest refreshes are cron output, not work.
        A leaf belongs to exactly one category. If two could fit, pick the category whose description names the thing.
        Within a person, order categories Catalog, Distribution, Visibility, AX, Product, Plumbing.

        SLACK FORMATTING
        This is Slack, not Markdown. Bold is ONE asterisk on each side, like *Catalog*. Double asterisks render literally in Slack and are always wrong. Never use them.
        The person name is a bold line on its own, with a blank line before it.
        Category lines start with • and a space. Leaf lines start with four spaces then ◦ and a space.
        Bold the category tag and the leaf tag. Bold nothing else inside a leaf.

        COMMITS
        $COMMITS"
            ;;
          developer)
            PROMPT="Summarize these commits for developers. Focus on technical changes: APIs, breaking changes, new features, bug fixes. Be specific about what changed. Rules: 3-5 bullets. Use Slack formatting: • for bullets, surround key terms with single asterisks for bold. Commits: $COMMITS"
            ;;
          marketing)
            PROMPT="Summarize these commits for a product update announcement. Focus on user-facing improvements and new capabilities. Keep it positive but not over the top. Rules: 3-5 bullets. Use Slack formatting: • for bullets, surround key terms with single asterisks for bold. Commits: $COMMITS"
            ;;
          *)
            PROMPT="Summarize these commits concisely. Rules: 3-5 bullets. Use Slack formatting: • for bullets, surround key terms with single asterisks for bold. Commits: $COMMITS"
            ;;
        esac

        # jq takes the prompt from a FILE, never as an argv string. Linux caps a
        # single argument at 128KB (MAX_ARG_STRLEN), and a busy day's commit body
        # already runs past 80KB, so --arg dies with 'Argument list too long'.
        PROMPT_FILE="$(mktemp)"
        REQUEST_FILE="$(mktemp)"
        trap 'rm -f "$PROMPT_FILE" "$REQUEST_FILE"' EXIT
        printf '%s' "$PROMPT" > "$PROMPT_FILE"

        # Call LLM based on provider
        case "$LLM_PROVIDER" in
          gemini)
            # maxOutputTokens must cover thinking tokens too: Gemini 3.x flash
            # spends 800-950 of them before writing a word, which silently
            # truncated every summary mid-sentence at the old 1000 cap.
            jq -n --rawfile prompt "$PROMPT_FILE" '{
              contents: [{parts: [{text: $prompt}]}],
              generationConfig: {
                temperature: 0.5,
                maxOutputTokens: 4000,
                thinkingConfig: {thinkingLevel: "low"}
              }
            }' > "$REQUEST_FILE"
            RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=$LLM_API_KEY" \
              -H 'Content-Type: application/json' \
              -d @"$REQUEST_FILE")
            SUMMARY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
            TRUNCATED=$(echo "$RESPONSE" | jq -r 'if .candidates[0].finishReason == "MAX_TOKENS" then "yes" else "no" end')
            ;;
          openai)
            jq -n --rawfile prompt "$PROMPT_FILE" '{
              model: "gpt-4o-mini",
              messages: [{role: "user", content: $prompt}],
              temperature: 0.5,
              max_tokens: 1000
            }' > "$REQUEST_FILE"
            RESPONSE=$(curl -s "https://api.openai.com/v1/chat/completions" \
              -H "Authorization: Bearer $LLM_API_KEY" \
              -H 'Content-Type: application/json' \
              -d @"$REQUEST_FILE")
            SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
            TRUNCATED=$(echo "$RESPONSE" | jq -r 'if .choices[0].finish_reason == "length" then "yes" else "no" end')
            ;;
          anthropic)
            jq -n --rawfile prompt "$PROMPT_FILE" '{
              model: "claude-sonnet-4-20250514",
              max_tokens: 1000,
              messages: [{role: "user", content: $prompt}]
            }' > "$REQUEST_FILE"
            RESPONSE=$(curl -s "https://api.anthropic.com/v1/messages" \
              -H "x-api-key: $LLM_API_KEY" \
              -H "anthropic-version: 2023-06-01" \
              -H 'Content-Type: application/json' \
              -d @"$REQUEST_FILE")
            SUMMARY=$(echo "$RESPONSE" | jq -r '.content[0].text // empty')
            TRUNCATED=$(echo "$RESPONSE" | jq -r 'if .stop_reason == "max_tokens" then "yes" else "no" end')
            ;;
          *)
            echo "Unknown LLM provider: $LLM_PROVIDER"
            exit 1
            ;;
        esac

        # Check for error
        if [ -z "$SUMMARY" ]; then
          echo "LLM API error. Response: $RESPONSE"
          exit 1
        fi

        # A truncated summary is not an empty one, so the check above misses it.
        # Fail instead of posting half a sentence to Slack.
        if [ "${TRUNCATED:-no}" = "yes" ]; then
          echo "::error::LLM hit its output cap and the summary is cut off mid-sentence. Nothing was posted to Slack."
          echo "Fix: raise maxOutputTokens in action.yml. On Gemini 3.x flash, thinking tokens count against that cap, so also set thinkingConfig.thinkingLevel to low."
          echo "Truncated summary was: $SUMMARY"
          exit 1
        fi

        # if/fi, not "[ ] && x": under set -e a trailing false && list can abort the job.
        COMMIT_WORD="commits"
        if [ "$COMMIT_COUNT" -eq 1 ]; then COMMIT_WORD="commit"; fi
        CONTRIBUTOR_WORD="contributors"
        if [ "$CONTRIBUTOR_COUNT" -eq 1 ]; then CONTRIBUTOR_WORD="contributor"; fi

        # Build and send Slack message
        SLACK_JSON=$(jq -n \
          --arg header "$PROJECT_NAME $HEADER ($DATE_DISPLAY)" \
          --arg summary "$SUMMARY" \
          --arg footer "$COMMIT_COUNT $COMMIT_WORD by $CONTRIBUTOR_COUNT $CONTRIBUTOR_WORD" \
          '{text: ("*" + $header + "*\n\n" + $summary + "\n\n_" + $footer + "_")}')

        curl -sf -X POST -H 'Content-type: application/json' \
          -d "$SLACK_JSON" \
          "$SLACK_WEBHOOK_URL"

        echo "Summary sent to Slack!"
